[project]
name = "cnoc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "harrylaulau", email = "dev+github@harrylaulau.me" }]
requires-python = ">=3.13"
dependencies = ["h5py>=3.15.1", "pandas>=2.3.3", "websockets>=15.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cnoc"]

[tool.uv]
link-mode = "copy"

[project.scripts]
cnoc = "cnoc.app.main:main"
imports = "cnoc.scripts.imports:main"
params = "cnoc.scripts.params:main"
experiment = "cnoc.scripts.experiment:main"
save_note = "cnoc.scripts.save_note:main"
rename_dataset = "cnoc.scripts.rename_dataset:main"
